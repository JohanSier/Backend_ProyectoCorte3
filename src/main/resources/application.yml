quarkus:
  application:
    name: Gestion de Colaboradores
    version: 1.0-SNAPSHOT

  # HTTP
  http:
    port: 8860
    host: localhost
    root-path: kkom
    #cors: true
    cors-origins: '*'
    cors-methods: GET,POST,PUT,DELETE,OPTIONS
    cors-headers: Content-Type,Authorization,X-Requested-With

  # Base de datos - PostgreSQL (Render Cloud)
  datasource:
    datasource:
    db-kind: postgresql
    jdbc:
      url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Hibernate ORM
  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: true

  # Configuracion de Logs
  log:
    level: INFO
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      dark-launch: true

    file:
      enabled: true
      path: logs/gclientes.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 5M
        max-backup-index: 5
        file-suffix: yyyy-MM-dd

  swagger-ui:
    enabled: true
    always-include: true
    path: "/swagger-ui"
    title: "Comedor comunitario - Vinni"
    description: "API generado en Quarkus para gestion de comedor comunitario"
    version: "V1"
    contact-name: ""

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "Comedor Comunitario"
          version: "1.1.0"