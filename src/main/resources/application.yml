quarkus:
  application:
    name: Gestion de Colaboradores
    version: 1.0-SNAPSHOT

  # HTTP
  http:
    port: 8860
    host: localhost
    root-path: kkom
    #cors: true
    cors-origins: '*'
    cors-methods: GET,POST,PUT,DELETE,OPTIONS
    cors-headers: Content-Type,Authorization,X-Requested-With


  # Base de datos - PostgreSQL (Render Cloud)
  datasource:
    db-kind: postgresql
    username: admin
    password: Mo71K9P0FKGJw09nP5H0NNnxhEwQ2NyB
    jdbc:
      url: "jdbc:postgresql://dpg-d81e4c7avr4c73bal18g-a.oregon-postgres.render.com:5432/comedordb_il6l?sslmode=require"


  # Hibernate-hibernate-orm:
  hibernate-orm:
    schema-management:
      strategy:
        drop-and-create
    log:
      sql: true


  # Configuracion de Logs
  log:
    level: INFO
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      dark-launch: true

    file:
      enabled: true
      path: logs/gestudiantes.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 5M # Tamaño máximo
        max-backup-index: 5 # Archivos conservados
        file-suffix: yyyy-MM-dd #Sufijo de retación

  swagger-ui:
    enabled: true
    always-include: true
    path: "/swager-ui"
    title: "Comedor comunitario - Vinni"
    description: "API generado en Quarkus para gestion de comedor comunitario"
    version: "V1"
    contact-name: "vinni9@gmail.com"

